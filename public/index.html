<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NewPlace</title>
  <meta name="theme-color" content="#b4532a">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="/icon.svg" alt="">NewPlace <small>remont</small></div>
    <nav class="tabs">
      <button data-tab="rooms">Pokoje</button>
      <button data-tab="insp">Inspiracje</button>
      <button data-tab="design">Kierunek designu</button>
    </nav>
    <div class="who">
      <div id="profiles"></div>
      <button class="icon" data-act="settings" title="Ustawienia profili">⚙</button>
    </div>
  </header>
  <main id="view"></main>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
